# render.yaml - Deployment configuration for Render.com

services:
  - type: web
    name: bon-voyage-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT --workers 4 --timeout 120 --access-logfile - --error-logfile - app:app
    scaling:
      minInstances: 1
      maxInstances: 3
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /
